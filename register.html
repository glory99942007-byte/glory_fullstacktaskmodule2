<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #1e3a8a;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 5px rgba(37,99,235,0.3);
        }

        .gender {
            display: flex;
            gap: 25px;
            margin-top: 12px;
        }

        .gender label {
            font-weight: normal;
        }

        .gender input {
            width: auto;
            margin-right: 5px;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        .show {
            position: absolute;
            right: 5px;
            top: 5px;
            padding: 7px 9px;
            background: #e5e7eb;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .terms {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .terms input {
            width: auto;
        }

        .terms label {
            margin: 0;
            font-weight: normal;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .buttons button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register {
            background: #2563eb;
            color: white;
        }

        .register:hover {
            background: #1d4ed8;
        }

        .reset {
            background: #e5e7eb;
            color: #333;
        }

        .reset:hover {
            background: #d1d5db;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 15px;
            }

            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Create Account</h1>
            <p>Please fill in the details to register</p>
        </div>

        <form id="registrationForm">

            <div class="form-row">

                <div class="form-group">
                    <label>Full Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email">
                </div>

            </div>


            <div class="form-row">

                <div class="form-group">
                    <label>Phone Number</label>
                    <input
                        type="text"
                        id="phone"
                        placeholder="Enter 10 digit number"
                        maxlength="10">
                </div>

                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="dob">
                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Gender</label>

                    <div class="gender">

                        <label>
                            <input type="radio"
                                   name="gender"
                                   value="Male">
                            Male
                        </label>

                        <label>
                            <input type="radio"
                                   name="gender"
                                   value="Female">
                            Female
                        </label>

                        <label>
                            <input type="radio"
                                   name="gender"
                                   value="Other">
                            Other
                        </label>

                    </div>

                </div>


                <div class="form-group">

                    <label>Course</label>

                    <select id="course">

                        <option value="">
                            Select Course
                        </option>

                        <option>BCA</option>
                        <option>B.Sc Computer Science</option>
                        <option>B.E Computer Science</option>
                        <option>B.Tech IT</option>
                        <option>MCA</option>

                    </select>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password">

                        <button
                            type="button"
                            class="show"
                            onclick="showPassword('password', this)">
                            Show
                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label>Confirm Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password">

                        <button
                            type="button"
                            class="show"
                            onclick="showPassword('confirmPassword', this)">
                            Show
                        </button>

                    </div>

                </div>

            </div>


            <div class="terms">

                <input type="checkbox" id="terms">

                <label>
                    I agree to the Terms & Conditions
                </label>

            </div>


            <div class="buttons">

                <button
                    type="submit"
                    class="register">
                    Register
                </button>

                <button
                    type="reset"
                    class="reset"
                    onclick="clearMessage()">
                    Reset
                </button>

            </div>


            <div id="message"></div>

        </form>

    </div>


    <script>

        function showPassword(id, button) {

            let password = document.getElementById(id);

            if (password.type === "password") {

                password.type = "text";
                button.innerHTML = "Hide";

            } else {

                password.type = "password";
                button.innerHTML = "Show";

            }
        }


        document.getElementById("registrationForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            let name =
                document.getElementById("name").value.trim();

            let email =
                document.getElementById("email").value.trim();

            let phone =
                document.getElementById("phone").value.trim();

            let dob =
                document.getElementById("dob").value;

            let course =
                document.getElementById("course").value;

            let password =
                document.getElementById("password").value;

            let confirmPassword =
                document.getElementById("confirmPassword").value;

            let terms =
                document.getElementById("terms").checked;

            let gender =
                document.querySelector(
                    'input[name="gender"]:checked'
                );

            let message =
                document.getElementById("message");


            if (
                name === "" ||
                email === "" ||
                phone === "" ||
                dob === "" ||
                course === "" ||
                password === "" ||
                confirmPassword === ""
            ) {

                message.style.color = "red";
                message.innerHTML =
                    "Please fill in all fields.";

                return;
            }


            if (!/^[0-9]{10}$/.test(phone)) {

                message.style.color = "red";
                message.innerHTML =
                    "Please enter a valid 10-digit phone number.";

                return;
            }


            if (!gender) {

                message.style.color = "red";
                message.innerHTML =
                    "Please select your gender.";

                return;
            }


            if (password.length < 6) {

                message.style.color = "red";
                message.innerHTML =
                    "Password must contain at least 6 characters.";

                return;
            }


            if (password !== confirmPassword) {

                message.style.color = "red";
                message.innerHTML =
                    "Passwords do not match.";

                return;
            }


            if (!terms) {

                message.style.color = "red";
                message.innerHTML =
                    "Please accept the Terms & Conditions.";

                return;
            }


            message.style.color = "green";

            message.innerHTML =
                "✓ Registration Successful!";

            alert(
                "Registration Successful!\n\n" +
                "Welcome " + name + "!"
            );

        });


        function clearMessage() {

            document.getElementById("message").innerHTML = "";

        }

    </script>

</body>
</html>
